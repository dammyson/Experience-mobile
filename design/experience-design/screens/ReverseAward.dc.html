<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience Business — Reverse award</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">
  <header style="padding: 56px 12px 14px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <a href="Activity.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F4F7">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-weight: 600; font-size: 16px">Reverse award</h1>
  </header>

  <div style="flex: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <section aria-label="Original award" style="border-radius: 16px; background: #15151C; border: 1px solid #24242E; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-weight: 600; font-size: 13px">Ada Okafor</span>
        <span style="font-weight: 700; font-size: 14px; color: #C9BFFF">+500 pts</span>
      </div>
      <dl style="margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 11px">
        <div style="display: flex; justify-content: space-between"><dt style="color: #9C9CAB">Program</dt><dd style="margin: 0">Kopi Regulars</dd></div>
        <div style="display: flex; justify-content: space-between"><dt style="color: #9C9CAB">Reason</dt><dd style="margin: 0">Purchase ₦5,000 · 19 Oct, 09:14</dd></div>
        <div style="display: flex; justify-content: space-between"><dt style="color: #9C9CAB">Still reversible</dt><dd style="margin: 0; font-weight: 600">500 pts</dd></div>
      </dl>
    </section>

    <div role="radiogroup" aria-label="Reversal type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button role="radio" aria-checked="{{m.on}}" onClick="{{m.pick}}" style="height: 64px; border-radius: 14px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: #F4F4F7; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer">
          <span style="font-size: 13px; font-weight: 600">{{m.label}}</span>
          <span style="font-size: 11px; color: {{m.sub}}">{{m.hint}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px 10px; align-items: center">
      <label for="rpts" style="font-size: 12px; color: #B9B9C6">Points:</label>
      <input id="rpts" value="{{ptsText}}" onChange="{{onPts}}" disabled="{{full}}" style="height: 44px; border-radius: 12px; border: 1px solid {{ptsBorder}}; background: {{ptsBg}}; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 700; outline: none">
      <label for="rreason" style="font-size: 12px; color: #B9B9C6">Reason:</label>
      <input id="rreason" value="Item returned" style="height: 44px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
    </div>

    <div role="note" style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; background: rgba(245,142,155,0.08); border: 1px solid #5A2A33; font-size: 12px; line-height: 1.5; color: #F7C4CB">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      <span>{{impact}} This can't be undone; you'd need to award again.</span>
    </div>
  </div>

  <div style="padding: 16px 20px 36px">
    <button style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: #C2334A; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{cta}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'partial', pts: 200 };
  }
  renderVals() {
    const full = this.state.mode === 'full';
    const n = full ? 500 : Math.min(this.state.pts, 500);
    const on = { bg: '#6B4EF0', border: '#8B74F7', sub: '#E2DCFF' };
    const off = { bg: '#15151C', border: '#2A2A35', sub: '#9C9CAB' };
    return {
      full,
      modes: [{ id: 'partial', label: 'Partial', hint: 'Take back some' }, { id: 'full', label: 'Full', hint: 'All 500 pts' }].map((m) => { const x = this.state.mode === m.id ? on : off; return { ...m, ...x, on: this.state.mode === m.id ? 'true' : 'false', pick: () => this.setState({ mode: m.id }) }; }),
      ptsText: n.toLocaleString('en-US'),
      onPts: (e) => this.setState({ pts: Number(String(e.target.value).replace(/[^0-9]/g, '')) || 0 }),
      ptsBorder: full ? '#24242E' : '#6B4EF0',
      ptsBg: full ? '#111117' : '#15151C',
      impact: n.toLocaleString('en-US') + ' pts will be removed from Ada’s Kopi House balance.',
      cta: 'Reverse ' + n.toLocaleString('en-US') + ' pts'
    };
  }
}
</script>
</body>
</html>
