<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience — Profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7">
  <header style="padding: 56px 20px 14px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <h1 style="margin: 0; font-weight: 600; font-size: 18px; line-height: 44px">Profile</h1>
  </header>

  <div style="padding: 20px 20px 120px; display: flex; flex-direction: column; gap: 18px">
    <section aria-label="Account" style="display: flex; align-items: center; gap: 14px">
      <div style="width: 60px; height: 60px; border-radius: 30px; background: #2A2240; border: 1px solid #4A3C7A; color: #D3CBFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">AO</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 700; font-size: 16px">Ada Okafor</span>
        <span style="font-size: 11px; color: #9C9CAB">ada.okafor@example.com</span>
        <span style="font-size: 11px; color: #9C9CAB">+234 803 000 0000</span>
      </div>
    </section>

    <a href="VerifyIdentity.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, #2B1F5C 0%, #15151C 100%); border: 1px solid #3A2E6E; color: #F4F4F7">
      <div style="width: 42px; height: 42px; border-radius: 12px; background: rgba(245,183,64,0.14); color: #F5B740; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M12 8v5M12 16h.01"/></svg>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-weight: 600; font-size: 13px">Verify your identity</span>
        <span style="font-size: 11px; color: #B9B9C6">Unlock bank transfers · takes about 2 minutes</span>
      </div>
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B9B9C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </a>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
      <section aria-label="{{g.title}}" style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: #B9B9C6">{{g.title}}</h2>
        <div style="border-radius: 16px; background: #15151C; border: 1px solid #24242E; overflow: hidden">
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
            <a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 0 14px; border-top: {{r.border}}; color: #F4F4F7">
              <span style="width: 32px; height: 32px; border-radius: 10px; background: #1F1F29; display: flex; align-items: center; justify-content: center">
                <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D9D9E3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.icon}}"/></svg>
              </span>
              <span style="flex: 1; font-weight: 600; font-size: 13px">{{r.label}}</span>
              <span style="font-size: 11px; color: #9C9CAB">{{r.value}}</span>
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <button style="height: 50px; border-radius: 14px; border: 1px solid #4A2530; background: rgba(245,142,155,0.08); color: #F58E9B; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer">Sign out</button>
  </div>

  <nav aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #0F0F15; border-top: 1px solid #1F1F29; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px 26px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="Explore.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explore</a>
    <a href="Rewards.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>Rewards</a>
    <a href="Wallet.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6"/><path d="M16.5 13.5h.01"/></svg>Wallet</a>
    <a href="Profile.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #B4A7FF; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const withBorders = (rows) => rows.map((r, i) => ({ ...r, href: r.href || '#', border: i === 0 ? '0' : '1px solid #24242E' }));
    return {
      groups: [
        { title: 'Account', rows: withBorders([
          { label: 'Personal details', value: 'View only', icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM4 21a8 8 0 0 1 16 0' },
          { label: 'Bank account', value: 'Safe Haven', icon: 'M3 10h18L12 4zM5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18' },
          { label: 'Favorite merchants', value: '4', icon: 'M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 5.5 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z' }
        ]) },
        { title: 'Security', rows: withBorders([
          { label: 'Reset password', value: 'By email code', href: 'ResetPassword.dc.html', icon: 'M5 11h14v10H5zM8 11V7a4 4 0 0 1 8 0v4' },
          { label: 'Biometric unlock', value: 'On', icon: 'M12 3a9 9 0 0 1 9 9M3 12a9 9 0 0 1 4-7.5M12 7a5 5 0 0 1 5 5v2M7 12a5 5 0 0 1 2-4M12 11v6' }
        ]) }
      ]
    };
  }
}
</script>
</body>
</html>
