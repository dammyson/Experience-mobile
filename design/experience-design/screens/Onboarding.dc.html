<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience — Onboarding</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF;text-decoration:none}a:hover{color:#C7CCE0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: radial-gradient(90% 55% at 50% 38%, rgba(107,78,240,0.45) 0%, rgba(10,10,15,0) 70%), linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 60px 24px 40px; box-sizing: border-box">
  <div style="display: flex; justify-content: space-between; align-items: center">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg role="img" aria-label="Experience" width="30" height="30" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="#7257F5" stroke-width="4"/><circle cx="25" cy="8" r="4" fill="#34D5A1"/></svg>
      <span style="font-weight: 600; font-size: 17px; letter-spacing: -0.01em">Experience</span>
    </div>
    <button onClick="{{skip}}" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #C7CCE0; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Skip</button>
  </div>

  <div aria-hidden="true" style="flex: 1; position: relative; display: flex; align-items: center; justify-content: center">
    <div style="position: absolute; width: 300px; height: 300px; border-radius: 150px; border: 1px solid rgba(199,204,224,0.16)"></div>
    <div style="position: absolute; width: 210px; height: 210px; border-radius: 105px; border: 1px solid rgba(199,204,224,0.22)"></div>
    <div style="width: 132px; height: 132px; border-radius: 40px; background: {{slide.color}}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 28px; color: {{slide.ink}}; transform: rotate(-6deg)">{{slide.glyph}}</div>
    <div style="position: absolute; top: 78px; left: 30px; padding: 8px 12px; border-radius: 14px; background: #FFFFFF; color: #101828; font-size: 12px; font-weight: 600">+120 pts · Kopi House</div>
    <div style="position: absolute; bottom: 92px; right: 18px; padding: 8px 12px; border-radius: 14px; background: #15151C; color: #34D5A1; font-size: 12px; font-weight: 600; border: 1px solid #2E2E3A">+80 pts · Pulse Gym</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div role="tablist" aria-label="Onboarding steps" style="display: flex; gap: 6px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{d.selected}}" aria-label="{{d.label}}" onClick="{{d.go}}" style="width: {{d.w}}; height: 8px; border-radius: 4px; border: 0; padding: 0; background: {{d.bg}}; cursor: pointer"></button>
      </sc-for>
    </div>
    <h1 style="margin: 8px 0 0; font-weight: 600; font-size: 28px; line-height: 1.12; letter-spacing: -0.02em">{{slide.title}}</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #C7CCE0">{{slide.body}}</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 32px">
    <button onClick="{{next}}" style="height: 52px; border-radius: 14px; border: 0; background: #6B4EF0; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{cta}}</button>
    <a href="Login.dc.html" style="height: 52px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px">I already have an account</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0 };
  }
  renderVals() {
    const slides = [
      { title: 'Earn everywhere', body: 'Collect loyalty points from the places you already love, all in one wallet.', glyph: 'pts', color: 'linear-gradient(135deg, #7A5CFA 0%, #4B2BD1 100%)', ink: '#FFFFFF' },
      { title: 'Spend smarter', body: 'Turn your points into rewards and pay for eligible purchases with them.', glyph: '₦', color: '#34D5A1', ink: '#0A2E22' },
      { title: 'Grow your business', body: 'Merchants: give customers a reason to come back, and see what works.', glyph: '↗', color: '#FFFFFF', ink: '#101828' }
    ];
    const i = this.state.i;
    return {
      slide: slides[i],
      cta: i === slides.length - 1 ? 'Create account' : 'Continue',
      next: () => this.setState({ i: Math.min(i + 1, slides.length - 1) }),
      skip: () => this.setState({ i: slides.length - 1 }),
      dots: slides.map((s, k) => ({ label: 'Step ' + (k + 1) + ': ' + s.title, selected: k === i ? 'true' : 'false', w: k === i ? '28px' : '8px', bg: k === i ? '#34D5A1' : 'rgba(199,204,224,0.35)', go: () => this.setState({ i: k }) }))
    };
  }
}
</script>
</body>
</html>
