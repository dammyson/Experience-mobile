<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience Business — Promotions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7; display: flex; flex-direction: column">
  <header style="padding: 56px 12px 14px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <a href="MerchantOverview.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F4F7">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-weight: 600; font-size: 16px">Campaigns</h1>
  </header>

  <div style="flex: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="#" style="height: 72px; border-radius: 14px; background: #6B4EF0; border: 1px solid #8B74F7; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1ZM16 8a5 5 0 0 1 0 8"/></svg>New promotion</a>
      <a href="Giveaway.dc.html" style="height: 72px; border-radius: 14px; background: #15151C; border: 1px solid #2A2A35; color: #F4F4F7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12px; font-weight: 600">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4zM14 7v10"/></svg>New giveaway</a>
    </div>

    <section aria-label="Promotions" style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600">Promotions</h2>
      <sc-for list="{{promos}}" as="p" hint-placeholder-count="3">
        <article style="border-radius: 14px; background: #15151C; border: 1px solid #24242E; padding: 14px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
            <div style="display: flex; flex-direction: column; gap: 3px">
              <span style="font-weight: 600; font-size: 14px">{{p.title}}</span>
              <span style="font-size: 12px; color: #B9B9C6">{{p.short}}</span>
            </div>
            <span style="flex-shrink: 0; padding: 4px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; background: {{p.bg}}; color: {{p.fg}}">{{p.status}}</span>
          </div>
          <div style="display: flex; gap: 8px; padding-top: 10px; border-top: 1px solid #24242E">
            <button style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #2E2E3A; background: transparent; color: #F4F4F7; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">Edit</button>
            <button style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #2E2E3A; background: transparent; color: #F4F4F7; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">{{p.toggle}}</button>
            <button aria-label="Delete {{p.title}}" style="width: 44px; height: 36px; border-radius: 10px; border: 1px solid #5A2A33; background: transparent; color: #F58E9B; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
            </button>
          </div>
        </article>
      </sc-for>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = { status: 'Active', bg: 'rgba(52,213,161,0.14)', fg: '#5EE6B6', toggle: 'Pause' };
    const paused = { status: 'Inactive', bg: '#24242E', fg: '#B9B9C6', toggle: 'Activate' };
    return {
      promos: [
        { title: 'Double points weekend', short: 'Earn 2× on every order, Sat–Sun', ...active },
        { title: 'Morning rush', short: 'Bonus points before 9am', ...active },
        { title: 'Harmattan hot chocolate', short: 'Seasonal — returns in December', ...paused }
      ]
    };
  }
}
</script>
</body>
</html>
