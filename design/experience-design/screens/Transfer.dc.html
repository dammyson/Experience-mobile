<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience — Transfer to bank</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7; font-variant-numeric: tabular-nums; display: flex; flex-direction: column">
  <header style="padding: 56px 12px 14px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <a href="Wallet.dc.html" aria-label="Back to wallet" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F4F7">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-weight: 600; font-size: 16px">Transfer to bank</h1>
  </header>

  <form style="flex: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 18px">
    <p style="margin: 0; font-weight: 600; font-size: 14px">Current balance: ₦184,250.00</p>

    <div style="display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 14px 10px; align-items: center">
      <label for="bank" style="font-size: 12px; color: #B9B9C6">Select bank:</label>
      <div style="position: relative">
        <select id="bank" style="width: 100%; height: 44px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 36px 0 14px; font: inherit; font-size: 13px; appearance: none">
          <option>GTBank</option><option>Access Bank</option><option>Kuda</option><option>Opay</option>
        </select>
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B9B9C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 12px; top: 14px; pointer-events: none"><path d="m6 9 6 6 6-6"/></svg>
      </div>

      <label for="acct" style="font-size: 12px; color: #B9B9C6">Account no.:</label>
      <input id="acct" inputmode="numeric" value="0124834821" style="height: 44px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; letter-spacing: 0.04em; outline: none">

      <span></span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #34D5A1; margin-top: -6px">
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>CHINEDU EZE</span>

      <label for="amt" style="font-size: 12px; color: #B9B9C6">Amount:</label>
      <input id="amt" inputmode="decimal" value="{{amountText}}" onChange="{{onAmount}}" placeholder="₦0" style="height: 44px; border-radius: 12px; border: {{amountBorder}}; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 14px; font-weight: 600; outline: none">
    </div>

    <sc-if value="{{over}}" hint-placeholder-val="{{ false }}">
      <span role="alert" style="font-size: 12px; font-weight: 600; color: #F58E9B; margin-top: -8px">That's more than your wallet balance.</span>
    </sc-if>

    <div role="group" aria-label="Quick amounts" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
        <button type="button" onClick="{{q.pick}}" aria-pressed="{{q.on}}" style="height: 38px; border-radius: 999px; border: 1px solid {{q.border}}; background: {{q.bg}}; color: #F4F4F7; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer">{{q.label}}</button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 10px; align-items: center">
      <label for="narr" style="font-size: 12px; color: #B9B9C6">Narration:</label>
      <input id="narr" value="October rent share" style="height: 44px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
    </div>
    <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #15151C; border: 1px solid #24242E; cursor: pointer">
      <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; font-weight: 600">Save beneficiary</span><span style="font-size: 11px; color: #9C9CAB">Send to Chinedu faster next time</span></span>
      <input type="checkbox" checked="{{save}}" onChange="{{toggleSave}}" style="width: 22px; height: 22px; accent-color: #6B4EF0">
    </label>
  </form>

  <div style="padding: 16px 20px 36px">
    <button onClick="{{openSheet}}" aria-disabled="{{disabled}}" style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: {{ctaBg}}; color: {{ctaFg}}; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Next</button>
  </div>

  <sc-if value="{{sheet}}" hint-placeholder-val="{{ false }}">
    <div onClick="{{closeSheet}}" aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>
    <section role="dialog" aria-modal="true" aria-label="Confirm transfer" style="position: absolute; left: 0; right: 0; bottom: 0; background: #15151C; border-top: 1px solid #2E2E3A; border-radius: 28px 28px 0 0; padding: 12px 20px 36px; display: flex; flex-direction: column; gap: 16px">
      <div aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #3A3A48"></div>
      <h2 style="margin: 0; font-weight: 600; font-size: 16px">Confirm transfer</h2>
      <dl style="margin: 0; display: flex; flex-direction: column; gap: 12px; font-size: 13px">
        <div style="display: flex; justify-content: space-between"><dt style="color: #B9B9C6">Name</dt><dd style="margin: 0; font-weight: 600">Chinedu Eze</dd></div>
        <div style="display: flex; justify-content: space-between"><dt style="color: #B9B9C6">Bank</dt><dd style="margin: 0; font-weight: 600">GTBank · 0124834821</dd></div>
        <div style="display: flex; justify-content: space-between"><dt style="color: #B9B9C6">Amount</dt><dd style="margin: 0; font-weight: 600">{{amountText}}</dd></div>
        <div style="display: flex; justify-content: space-between"><dt style="color: #B9B9C6">Narration</dt><dd style="margin: 0; font-weight: 600">October rent share</dd></div>
      </dl>
      <span style="font-size: 11px; color: #9C9CAB">Bank transfers can't be reversed once sent.</span>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px">
        <button onClick="{{closeSheet}}" style="height: 50px; border-radius: 14px; border: 1px solid #2E2E3A; background: #1F1F29; color: #F4F4F7; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer">Edit</button>
        <a href="TransferStatus.dc.html" style="height: 50px; border-radius: 14px; background: #6B4EF0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">Send now</a>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { amount: 25000, save: true };
  }
  renderVals() {
    const s = this.state;
    const bal = 184250;
    const fmt = (n) => '₦' + n.toLocaleString('en-US');
    const over = s.amount > bal;
    const ok = s.amount > 0 && !over;
    return {
      amountText: s.amount ? fmt(s.amount) : '',
      onAmount: (e) => this.setState({ amount: Number(String(e.target.value).replace(/[^0-9.]/g, '')) || 0 }),
      over,
      amountBorder: over ? '1.5px solid #F58E9B' : '1px solid #6B4EF0',
      quick: [5000, 10000, 25000, 50000].map((v) => ({ label: fmt(v / 1000) + 'k', on: s.amount === v ? 'true' : 'false', bg: s.amount === v ? '#6B4EF0' : '#15151C', border: s.amount === v ? '#8B74F7' : '#2E2E3A', pick: () => this.setState({ amount: v }) })),
      disabled: ok ? 'false' : 'true',
      save: !!s.save,
      toggleSave: () => this.setState({ save: !s.save }),
      sheet: !!s.sheet,
      openSheet: () => { if (ok) this.setState({ sheet: true }); },
      closeSheet: () => this.setState({ sheet: false }),
      ctaBg: ok ? '#6B4EF0' : '#2A2148',
      ctaFg: ok ? '#FFFFFF' : '#9C93C9'
    };
  }
}
</script>
</body>
</html>
