<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience Business — Register</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7; display: flex; flex-direction: column">
  <header style="padding: 56px 12px 14px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <a href="Login.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F4F7">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; flex: 1; font-weight: 600; font-size: 16px">Register your business</h1>
    <span style="padding-right: 8px; font-size: 11px; font-weight: 600; color: #B9B9C6">Step 1 of 2</span>
  </header>
  <div aria-hidden="true" style="padding: 12px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
    <div style="height: 4px; border-radius: 2px; background: #6B4EF0"></div>
    <div style="height: 4px; border-radius: 2px; background: #24242E"></div>
  </div>

  <form style="flex: 1; padding: 18px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 600">Business details</h2>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #B9B9C6">Business name</span>
      <input value="Kopi House" style="height: 46px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #B9B9C6">Handle</span>
      <span style="display: flex; align-items: center; height: 46px; border-radius: 12px; border: 1px solid #6B4EF0; background: #15151C; padding: 0 14px; font-size: 13px">
        <span style="color: #9C9CAB">experience/</span><input value="kopi-house" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F4F4F7; font: inherit; font-size: 13px; outline: none">
      </span>
      <span style="font-size: 11px; color: #5EE6B6">Available · lowercase letters, numbers and dashes</span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #B9B9C6">Short description</span>
      <input value="Specialty coffee in Lekki" style="height: 46px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #B9B9C6">Business email</span>
      <input type="email" value="hello@kopihouse.ng" style="height: 46px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #B9B9C6">Business phone</span>
      <input type="tel" value="+234 700 000 1234" style="height: 46px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #B9B9C6">Country</span><span style="height: 46px; border-radius: 12px; border: 1px solid #24242E; background: #111117; display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: #D9D9E3">Nigeria</span></div>
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; color: #B9B9C6">Currency</span><span style="height: 46px; border-radius: 12px; border: 1px solid #24242E; background: #111117; display: flex; align-items: center; padding: 0 14px; font-size: 13px; color: #D9D9E3">NGN (₦)</span></div>
    </div>
  </form>

  <div style="padding: 16px 20px 36px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 11px; color: #9C9CAB; text-align: center">Next: the admin who will sign in to manage this business.</span>
    <button style="height: 52px; border-radius: 14px; border: 0; background: #6B4EF0; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
