<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience — Wallet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7; font-variant-numeric: tabular-nums">
  <header style="padding: 56px 20px 14px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <h1 style="margin: 0; font-weight: 600; font-size: 18px; line-height: 44px">Wallet</h1>
  </header>

  <div style="padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 18px">
    <section aria-label="Wallet balance" style="position: relative; overflow: hidden; border-radius: 20px; background: linear-gradient(135deg, #7A5CFA 0%, #4B2BD1 55%, #2E1890 100%); padding: 18px; display: flex; flex-direction: column; gap: 18px">
      <div aria-hidden="true" style="position: absolute; right: -40px; top: -50px; width: 180px; height: 180px; border-radius: 90px; border: 28px solid rgba(255,255,255,0.08)"></div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; color: #E2DCFF">Available balance</span>
        <span style="font-weight: 700; font-size: 26px; letter-spacing: -0.02em">₦184,250<span style="font-size: 16px; color: #E2DCFF">.00</span></span>
      </div>
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 11px; color: #E2DCFF">Safe Haven MFB · Ada Okafor</span>
          <span style="font-weight: 600; font-size: 14px; letter-spacing: 0.1em">0123 456 789</span>
        </div>
        <button aria-label="Copy account number" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(10,10,15,0.3); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
        </button>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <a href="Transfer.dc.html" style="height: 46px; border-radius: 12px; background: #6B4EF0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 13px">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg>Transfer</a>
      <a href="#" style="height: 46px; border-radius: 12px; background: #1F1F29; border: 1px solid #2E2E3A; color: #F4F4F7; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 13px">
        <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add money</a>
    </div>

    <section aria-label="Activity" style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-weight: 600; font-size: 14px">Activity</h2>
      <div role="group" aria-label="Filter activity" style="display: flex; gap: 8px">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
          <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #F4F4F7; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer">{{c.label}}</button>
        </sc-for>
      </div>
      <sc-for list="{{rows}}" as="t" hint-placeholder-count="4">
        <article style="border-radius: 14px; background: #15151C; border: 1px solid #24242E; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-weight: 600; font-size: 13px">{{t.title}}</span>
            <span style="font-size: 11px; font-weight: 600; color: {{t.statusColor}}">{{t.status}}</span>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 700; font-size: 14px">{{t.amount}}</span>
              <span style="font-size: 11px; color: #9C9CAB">{{t.sub}}</span>
            </div>
            <a href="{{t.href}}" style="height: 32px; padding: 0 12px; border-radius: 8px; background: #6B4EF0; color: #FFFFFF; display: flex; align-items: center; font-size: 11px; font-weight: 600">See details</a>
          </div>
        </article>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #0F0F15; border-top: 1px solid #1F1F29; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px 26px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="Explore.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explore</a>
    <a href="Rewards.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>Rewards</a>
    <a href="Wallet.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #B4A7FF; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6"/><path d="M16.5 13.5h.01"/></svg>Wallet</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'All' };
  }
  renderVals() {
    const f = this.state.f;
    const all = [
      { kind: 'Transfers', title: 'Transfer to GTBank', status: 'Pending', statusColor: '#F5B740', amount: '−₦25,000', sub: 'Chinedu Eze · Today, 14:02', href: 'TransferStatus.dc.html' },
      { kind: 'Top-ups', title: 'Wallet top-up', status: 'Completed', statusColor: '#34D5A1', amount: '+₦50,000', sub: 'From Access Bank · Today, 09:41', href: '#' },
      { kind: 'Transfers', title: 'Transfer to Kuda', status: 'Failed · reversed', statusColor: '#F58E9B', amount: '₦12,000', sub: 'Bisi Ade · 14 Oct', href: 'TransferStatus.dc.html' },
      { kind: 'Transfers', title: 'Transfer to Opay', status: 'Completed', statusColor: '#34D5A1', amount: '−₦8,500', sub: 'Musa Ali · 14 Oct', href: '#' }
    ];
    return {
      chips: ['All', 'Transfers', 'Top-ups'].map((l) => ({ label: l, on: f === l ? 'true' : 'false', bg: f === l ? '#6B4EF0' : 'transparent', border: f === l ? '#8B74F7' : '#2E2E3A', pick: () => this.setState({ f: l }) })),
      rows: all.filter((r) => f === 'All' || r.kind === f)
    };
  }
}
</script>
</body>
</html>
