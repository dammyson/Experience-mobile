<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience — Explore Merchants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7; font-variant-numeric: tabular-nums">
  <header style="padding: 56px 20px 14px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <h1 style="margin: 0; font-weight: 600; font-size: 18px; line-height: 44px">Explore</h1>
  </header>

  <div style="padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 16px">
    <label style="height: 46px; border-radius: 12px; background: #15151C; border: 1px solid #2E2E3A; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: #9C9CAB">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search merchants</span>
      <input type="search" placeholder="Search merchants" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 13px; color: #F4F4F7">
    </label>

    <div role="group" aria-label="Filter merchants" style="display: flex; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #F4F4F7; font: inherit; font-size: 11px; font-weight: 600; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>

    <section aria-label="Featured promotion" style="position: relative; overflow: hidden; border-radius: 18px; background: linear-gradient(135deg, #2B1F5C 0%, #15151C 100%); border: 1px solid #3A2E6E; padding: 16px; display: flex; flex-direction: column; gap: 6px">
      <div aria-hidden="true" style="position: absolute; right: -10px; top: -14px; font-weight: 700; font-size: 86px; color: rgba(165,149,255,0.14); letter-spacing: -0.04em">2×</div>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B4A7FF">Promotion</span>
      <span style="font-weight: 700; font-size: 16px">Double points at Kopi House</span>
      <span style="font-size: 11px; color: #B9B9C6">Every purchase · ends Sun 25 Oct</span>
    </section>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{shown}}" as="m" hint-placeholder-count="4">
        <article style="border-radius: 16px; background: #15151C; border: 1px solid #24242E; padding: 14px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; gap: 12px">
            <div style="width: 46px; height: 46px; border-radius: 14px; background: #24242E; border: 1px solid #33333F; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">{{m.initials}}</div>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 600; font-size: 14px">{{m.name}}</span>
              <span style="font-size: 11px; color: #9C9CAB">{{m.category}}</span>
            </div>
            <button aria-label="{{m.favLabel}}" aria-pressed="{{m.fav}}" onClick="{{m.toggle}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2E2E3A; background: transparent; color: {{m.heart}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="{{m.heartFill}}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 12 5.5 5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/></svg>
            </button>
          </div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <span style="padding: 5px 10px; border-radius: 999px; background: rgba(165,149,255,0.14); color: #C9BFFF; font-size: 11px; font-weight: 600">{{m.pts}} pts</span>
            <sc-if value="{{m.promo}}" hint-placeholder-val="{{ true }}">
              <span style="padding: 5px 10px; border-radius: 999px; background: rgba(52,213,161,0.14); color: #5EE6B6; font-size: 11px; font-weight: 600">{{m.promoText}}</span>
            </sc-if>
            <span style="padding: 5px 10px; border-radius: 999px; border: 1px solid #2E2E3A; color: #B9B9C6; font-size: 11px; font-weight: 600">{{m.redeem}}</span>
          </div>
        </article>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Primary" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; background: #0F0F15; border-top: 1px solid #1F1F29; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 6px 26px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="Explore.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #B4A7FF; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Explore</a>
    <a href="Rewards.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>Rewards</a>
    <a href="Wallet.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V5a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6"/><path d="M16.5 13.5h.01"/></svg>Wallet</a>
    <a href="Profile.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8A8A99; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', favs: { kh: true, lf: true } };
  }
  renderVals() {
    const merchants = [
      { id: 'kh', initials: 'KH', name: 'Kopi House', category: 'Café · Lekki', pts: '4,200', promo: true, promoText: '2× points', redeem: 'Pay up to 50%' },
      { id: 'lf', initials: 'LF', name: 'Lagos Fresh Market', category: 'Groceries · Yaba', pts: '3,150', promo: false, promoText: '', redeem: 'Pay in full' },
      { id: 'nb', initials: 'NB', name: 'Novabook', category: 'Books · Ikeja', pts: '0', promo: true, promoText: 'Welcome bonus', redeem: 'Not earning yet' },
      { id: 'pg', initials: 'PG', name: 'Pulse Gym', category: 'Fitness · VI', pts: '1,900', promo: false, promoText: '', redeem: 'Pay up to 30%' }
    ];
    const f = this.state.filter;
    const favs = this.state.favs;
    const chips = [['all', 'All'], ['fav', 'Favorites'], ['pts', 'With points'], ['promo', 'Promos']].map(([id, label]) => ({ label, on: f === id ? 'true' : 'false', bg: f === id ? '#6B4EF0' : 'transparent', border: f === id ? '#8B74F7' : '#2E2E3A', pick: () => this.setState({ filter: id }) }));
    const shown = merchants.filter((m) => f === 'all' || (f === 'fav' && favs[m.id]) || (f === 'pts' && m.pts !== '0') || (f === 'promo' && m.promo)).map((m) => {
      const fav = !!favs[m.id];
      return { ...m, fav: fav ? 'true' : 'false', favLabel: (fav ? 'Remove ' : 'Add ') + m.name + (fav ? ' from favorites' : ' to favorites'), heart: fav ? '#FF7A9A' : '#8A8A99', heartFill: fav ? '#FF7A9A' : 'none', toggle: () => this.setState({ favs: { ...favs, [m.id]: !fav } }) };
    });
    return { chips, shown };
  }
}
</script>
</body>
</html>
