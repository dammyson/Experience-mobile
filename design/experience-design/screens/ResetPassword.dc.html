<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience — Reset password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7; display: flex; flex-direction: column">
  <header style="padding: 56px 12px 14px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <button onClick="{{back}}" aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #F4F4F7; cursor: pointer">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <h1 style="margin: 0; flex: 1; font-weight: 600; font-size: 16px">{{title}}</h1>
    <span style="padding-right: 8px; font-size: 11px; font-weight: 600; color: #B9B9C6">{{stepLabel}}</span>
  </header>
  <div aria-hidden="true" style="padding: 12px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
    <sc-for list="{{bars}}" as="b" hint-placeholder-count="3"><div style="height: 4px; border-radius: 2px; background: {{b.bg}}"></div></sc-for>
  </div>

  <div style="flex: 1; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{s1}}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #B9B9C6">Enter the email on your account. If it exists, we'll send a 6-digit code.</p>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #B9B9C6">Email address</span>
        <input type="email" value="ada.okafor@example.com" style="height: 48px; border-radius: 12px; border: 1px solid #6B4EF0; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
      </label>
    </sc-if>

    <sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #B9B9C6">Enter the 6-digit code sent to <b style="color: #F4F4F7">ada.okafor@example.com</b></p>
      <div role="group" aria-label="One-time code" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{digits}}" as="d" hint-placeholder-count="6">
          <input aria-label="{{d.label}}" inputmode="numeric" maxlength="1" value="{{d.v}}" style="height: 54px; border-radius: 12px; border: 1px solid {{d.border}}; background: #15151C; color: #F4F4F7; text-align: center; font: inherit; font-size: 20px; font-weight: 700; outline: none; min-width: 0">
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #9C9CAB">Didn't get it? <a href="#" style="font-weight: 600">Resend in 0:42</a></span>
    </sc-if>

    <sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #B9B9C6">Choose a new password you haven't used before.</p>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #B9B9C6">New password</span>
        <input type="password" value="NewSecurePass1!" style="height: 48px; border-radius: 12px; border: 1px solid #6B4EF0; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #B9B9C6">Confirm password</span>
        <input type="password" value="NewSecurePass1!" style="height: 48px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
      </label>
    </sc-if>

    <sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding-bottom: 80px">
        <span style="width: 64px; height: 64px; border-radius: 32px; background: rgba(52,213,161,0.14); color: #34D5A1; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>
        </span>
        <h2 style="margin: 0; font-weight: 700; font-size: 19px">Password updated</h2>
        <p style="margin: 0; font-size: 12px; color: #B9B9C6">Sign in with your new password.</p>
      </div>
    </sc-if>
  </div>

  <div style="padding: 16px 20px 36px">
    <button onClick="{{next}}" style="width: 100%; height: 52px; border-radius: 14px; border: 0; background: #6B4EF0; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer">{{cta}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 2 };
  }
  renderVals() {
    const st = this.state.step;
    const code = ['4', '8', '2', '0', '', ''];
    return {
      s1: st === 1, s2: st === 2, s3: st === 3, s4: st === 4,
      title: ['Forgot password', 'Enter code', 'New password', 'All set'][st - 1],
      stepLabel: st < 4 ? 'Step ' + st + ' of 3' : '',
      bars: [1, 2, 3].map((i) => ({ bg: i <= st ? '#6B4EF0' : '#24242E' })),
      digits: code.map((v, i) => ({ v, label: 'Digit ' + (i + 1), border: i === 4 ? '#8B74F7' : (v ? '#3A3A48' : '#2E2E3A') })),
      cta: ['Send code', 'Verify code', 'Reset password', 'Back to sign in'][st - 1],
      next: () => this.setState({ step: st === 4 ? 1 : st + 1 }),
      back: () => this.setState({ step: Math.max(1, st - 1) })
    };
  }
}
</script>
</body>
</html>
