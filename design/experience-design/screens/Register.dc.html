<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Experience — Create account</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#B4A7FF;text-decoration:none}a:hover{color:#D3CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0A0A0F; background-image: linear-gradient(180deg, #3A1A8F 0px, #1C0F4A 110px, #0A0A0F 240px); font-family: 'DM Sans', system-ui, sans-serif; color: #F4F4F7; display: flex; flex-direction: column">
  <header style="padding: 56px 12px 14px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <a href="Login.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #F4F4F7">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-weight: 600; font-size: 16px">Create account</h1>
  </header>

  <form style="flex: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <p style="margin: 0 0 4px; font-size: 13px; color: #B9B9C6">Start collecting points from your favourite places.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #B9B9C6">First name</span>
        <input value="Ada" style="height: 46px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 12px; color: #B9B9C6">Last name</span>
        <input value="Okafor" style="height: 46px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
      </label>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #B9B9C6">Email address</span>
      <input type="email" value="ada.okafor@example.com" style="height: 46px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #B9B9C6">Phone number</span>
      <span style="display: flex; gap: 8px">
        <span style="height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; display: flex; align-items: center; font-size: 13px; font-weight: 600">+234</span>
        <input type="tel" value="803 000 0000" style="flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid #2E2E3A; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
      </span>
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; color: #B9B9C6">Password</span>
      <input type="password" value="SecurePass1" style="height: 46px; border-radius: 12px; border: 1px solid #6B4EF0; background: #15151C; color: #F4F4F7; padding: 0 14px; font: inherit; font-size: 13px; outline: none">
    </label>
    <ul aria-label="Password rules" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; font-size: 11px">
      <li style="display: flex; align-items: center; gap: 6px; color: #5EE6B6"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>8+ characters</li>
      <li style="display: flex; align-items: center; gap: 6px; color: #5EE6B6"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>Upper &amp; lower case</li>
      <li style="display: flex; align-items: center; gap: 6px; color: #5EE6B6"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>A number</li>
      <li style="display: flex; align-items: center; gap: 6px; color: #9C9CAB"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="6"/></svg>A symbol</li>
    </ul>
  </form>

  <div style="padding: 16px 20px 36px; display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 11px; color: #9C9CAB; text-align: center">By continuing you agree to the [TERMS] and [PRIVACY POLICY].</span>
    <button style="height: 52px; border-radius: 14px; border: 0; background: #2A2148; color: #9C93C9; font: inherit; font-weight: 600; font-size: 14px" aria-disabled="true">Create account</button>
    <p style="margin: 0; text-align: center; font-size: 12px; color: #9C9CAB">Have a business? <a href="MerchantRegister.dc.html" style="font-weight: 600">Register it instead</a></p>
  </div>
</div>
</x-dc>

</html>
